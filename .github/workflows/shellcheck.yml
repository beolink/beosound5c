name: Shell script lint

# The installer is ~19k of bash and is the code most likely to break for
# someone who isn't the author — a stranger's first five minutes with this
# project run through it. Unit tests never touch it, so lint it here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      - name: Lint installer and service scripts
        run: |
          # -e: severity floor. Style/info findings on 3k lines of existing
          # bash would be noise; warnings and errors are real bugs (unquoted
          # expansions, unreachable code, bad test syntax).
          #
          # SC1091: sourced files aren't followed (modules source each other
          #         through variables shellcheck can't resolve).
          # SC2317: false positives from `set -e` + trap-style helpers.
          git ls-files '*.sh' 'tools/bs5c-support' > /tmp/scripts.txt
          printf 'Linting %d scripts\n' "$(wc -l < /tmp/scripts.txt)"
          xargs -a /tmp/scripts.txt shellcheck \
            --severity=warning --exclude=SC1091,SC2317 --shell=bash

      - name: Syntax-check every script
        if: always()
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "SYNTAX ERROR: $f"; fail=1; }
          done < <(git ls-files '*.sh' 'tools/bs5c-support')
          exit "$fail"
