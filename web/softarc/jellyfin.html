<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JELLYFIN - Beosound 5c</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="splash.css">
    <link rel="stylesheet" href="../assets/phosphor/phosphor.css">
    <style>:root { --splash-accent: #00A4DC; }</style>
</head>
<body>
    <div id="app">
        <div class="counter">
            <span id="current-item">1</span> / <span id="total-items">100</span>
        </div>
        <div class="hierarchy-depth-1" id="hierarchy-background"></div>
        <div class="arc-container" id="arc-container"></div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/demo-backend.js"></script>
    <script src="../js/arc-utils.js"></script>
    <script src="../js/emulator-bridge.js"></script>
    <script src="../assets/qrcode.min.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const JELLYFIN_URL = getServiceUrl('jellyfinServiceUrl', 8781);

            // Check Jellyfin service state
            try {
                const resp = await fetch(`${JELLYFIN_URL}/playlists`);
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.setup_needed) {
                        showSetupScreen();
                        return;
                    }
                    if (data.loading) {
                        showLoadingScreen();
                        return;
                    }
                    if (Array.isArray(data) && data.length === 0) {
                        showEmptyScreen();
                        return;
                    }
                }
            } catch (e) {
                // Service unavailable — fall through to local JSON
            }

            // Normal playlist browsing — load from API
            initArcList(JELLYFIN_URL + '/playlists');
        });

        // Unlike Plex, Jellyfin has no cloud login page to send the user to:
        // the server address is something only they know, so setup happens on
        // this device's own page. The QR carries them there.
        async function setupPageUrl() {
            let ip = location.hostname;
            try {
                const resp = await fetch('http://localhost:8767/info');
                const data = await resp.json();
                if (data.ip_address) ip = data.ip_address;
            } catch (e) { /* fall back to whatever served this page */ }
            return `http://${ip}:8781/setup`;
        }

        async function showSetupScreen() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="splash-screen">
                    <div class="splash-card">
                        <h2>CONNECT JELLYFIN</h2>
                        <p>Scan this code to open the setup page on your phone,<br>
                        and sign in to your Jellyfin server.</p>
                        <div id="setup-qr" class="setup-qr" style="display:none"></div>
                        <div id="setup-url" class="setup-url"></div>
                    </div>
                </div>`;

            const url = await setupPageUrl();
            document.getElementById('setup-url').textContent = url;

            const qrEl = document.getElementById('setup-qr');
            if (typeof QRCode !== 'undefined') {
                qrEl.style.display = 'inline-block';
                qrEl.innerHTML = '';
                new QRCode(qrEl, {
                    text: url,
                    width: 180,
                    height: 180,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.M
                });
            }

            pollForPlaylists();
        }

        function showEmptyScreen() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="splash-screen">
                    <div class="splash-card">
                        <h2>NO PLAYLISTS</h2>
                        <p>Your Jellyfin server has no audio playlists or albums.<br>
                        Add music to your Jellyfin library, then come back here.</p>
                    </div>
                </div>`;

            pollForPlaylists();
        }

        function showLoadingScreen() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="splash-screen">
                    <div class="splash-card">
                        <div class="loading-spinner"></div>
                        <h2>LOADING PLAYLISTS</h2>
                        <p>Fetching your Jellyfin library...</p>
                    </div>
                </div>`;

            pollForPlaylists();
        }

        function pollForPlaylists() {
            const JELLYFIN_URL = getServiceUrl('jellyfinServiceUrl', 8781);
            const poll = setInterval(async () => {
                try {
                    const resp = await fetch(`${JELLYFIN_URL}/playlists`);
                    if (resp.ok) {
                        const data = await resp.json();
                        if (data.loading && !document.querySelector('.loading-spinner')) {
                            clearInterval(poll);
                            showLoadingScreen();
                            return;
                        }
                        if (Array.isArray(data) && data.length > 0) {
                            clearInterval(poll);
                            location.reload();
                        }
                    }
                } catch (e) { /* keep polling */ }
            }, 3000);
        }

        function initArcList(dataUrl) {
            const jellyfinConfig = {
                dataSource: dataUrl || '../json/jellyfin_playlists.json',
                dataType: 'parent_child',
                viewMode: 'hierarchical',
                parentKey: 'tracks',
                parentNameKey: 'name',
                storagePrefix: 'jellyfin_arclist',
                title: 'JELLYFIN',
                context: 'jellyfin',
                sourceCommandUrl: getServiceUrl('jellyfinServiceUrl', 8781) + '/command',
                childNameMapper: (track, index, allTracks) => {
                    const allSameArtist = allTracks && allTracks.every(t => t.artist === allTracks[0].artist);
                    let displayName;
                    if (allSameArtist) {
                        displayName = track.name;
                    } else {
                        displayName = `${track.name}\n(${track.artist})`;
                    }
                    return {
                        id: track.id,
                        name: displayName,
                        image: track.image || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHZpZXdCb3g9IjAgMCA2NCA2NCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiBmaWxsPSIjMzMzMzMzIi8+Cjx0ZXh0IHg9IjMyIiB5PSI0MCIgZm9udC1mYW1pbHk9IkFyaWFsLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjI0IiBmaWxsPSIjZmZmZmZmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj7imqo8L3RleHQ+Cjwvc3ZnPgo='
                    };
                }
            };

            const arcList = new ArcList(jellyfinConfig);
            window.arcListInstance = arcList;
        }
    </script>
</body>
</html>
